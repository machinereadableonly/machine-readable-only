# Publishes the reference client, mro-agent, to npm.
#
# WHY THIS EXISTS: the client is the product -- built-in MCP clients cannot
# sign, so `npx mro-agent` is how an agent actually arrives. Publishing it from
# CI rather than a laptop does two things. It keeps a personal handle off the
# package, which is the reason an npm organisation was considered and then
# dropped as unnecessary. And it produces a provenance attestation, which is
# npm's cryptographic record of which workflow, in which repository, at which
# commit, built the tarball an agent is about to run.
#
# HOW IT AUTHENTICATES: npm trusted publishing, over OIDC. There is no npm
# token anywhere -- not in the repository, not in Actions secrets, not on the
# runner. GitHub mints a short-lived credential scoped to this one workflow,
# and npm accepts it only if the package's Trusted Publisher settings name this
# repository and this filename. Renaming this file breaks publishing until the
# setting on npmjs.com is updated to match.
#
# HOW IT RUNS: manually, and it STAGES rather than publishes. The trusted
# publisher on npm is configured stage-only, so a direct `npm publish` from
# here would be REFUSED by the registry -- that is deliberate, and it is the
# real guard. Nothing this workflow can do makes a version public.
#
# A staged version sits in npm's queue until a maintainer approves it with
# `npm stage approve <stage-id>`, or on npmjs.com, and that approval demands
# two-factor authentication. So the thing that makes `mro-agent` public is a
# person holding a second factor, not a checkbox in a CI file.
#
# An earlier draft of this workflow ran `npm publish` and defaulted a
# `dry_run` input to true. That is a convention: it protects the package only
# while everyone remembers to leave a box ticked. Staging protects it
# structurally.
#
# Discard a staged version with `npm stage reject <stage-id>`; list them with
# `npm stage list mro-agent`.

name: publish-client

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check, stage nothing. Untick to stage for approval."
        type: boolean
        default: true

# id-token: write is what lets GitHub mint the OIDC credential npm exchanges
# for publish rights. Without it the publish step fails as unauthenticated.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Never publish from a fork. A fork's OIDC claims would not match the
    # trusted publisher anyway, but failing here says why in one line.
    if: github.repository == 'machinereadableonly/machine-readable-only'

    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          # The identity guard reads `git log --all`, so a shallow clone would
          # let it pass without having seen most of the history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # npm's own guidance for release builds: a restored cache can put a
          # stale dependency into the tarball that no commit accounts for.
          package-manager-cache: false

      - name: Use an npm new enough to stage over OIDC
        # Trusted publishing needs npm 11.5.1 or later and STAGED publishing
        # needs 11.15.0 or later, with Node 22.14 or higher. The runner is on
        # Node 24 and this installs the current npm, but the floors are
        # ASSERTED rather than assumed: a runner image change that quietly
        # moved npm backwards would otherwise surface as an unexplained
        # registry refusal.
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error(`FAIL: staged publishing needs Node 22.14+, got ${process.versions.node}`);
              process.exit(1);
            }
          '
          npm --version | node -e '
            const v = require("fs").readFileSync(0, "utf8").trim();
            const [maj, min] = v.split(".").map(Number);
            if (maj < 11 || (maj === 11 && min < 15)) {
              console.error(`FAIL: staged publishing needs npm 11.15.0+, got ${v}`);
              process.exit(1);
            }
            console.log(`npm ${v} is new enough to stage`);
          '

      - name: Check the tracked tree for identity leaks
        # The same guard the pre-push hook runs. A published tarball is
        # permanent in a way a pushed commit is not.
        run: node tools/prepublish-check.mjs

      - name: Install the client's dependencies
        working-directory: client
        run: npm ci

      - name: Run the client's tests
        working-directory: client
        run: npm test

      - name: Refuse a version that is already published
        working-directory: client
        # npm would reject a duplicate anyway, but only after the tarball had
        # been built and uploaded. This says so in one readable line instead.
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "About to publish mro-agent@${version}"
          if npm view "mro-agent@${version}" version > /dev/null 2>&1; then
            echo "mro-agent@${version} is already on the registry."
            echo "Bump the version in client/package.json first."
            exit 1
          fi
          echo "Version ${version} is free."

      - name: Stage (dry run -- nothing leaves the runner)
        if: ${{ inputs.dry_run }}
        working-directory: client
        run: npm stage publish --dry-run

      - name: Stage for approval
        if: ${{ !inputs.dry_run }}
        working-directory: client
        # No --provenance flag: trusted publishing attaches the attestation on
        # its own, and passing the flag with no token is an error.
        #
        # This does NOT make the version public. It puts it in npm's staging
        # queue, where it waits for `npm stage approve <stage-id>` and a second
        # factor.
        run: npm stage publish

      - name: Say what is waiting, and how to discard it
        if: ${{ !inputs.dry_run && success() }}
        working-directory: client
        # The run log is where someone looks after triggering this, so the next
        # two commands belong there rather than in a document they would have
        # to go and find.
        run: |
          echo "Staged, NOT published. Nothing is public yet."
          echo
          npm stage list mro-agent || true
          echo
          echo "To make it public:  npm stage approve <stage-id>   (asks for 2FA)"
          echo "To discard it:      npm stage reject  <stage-id>"
